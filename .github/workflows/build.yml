# Builds click.exe on every push. Pushing a tag like v1.0 also publishes it
# as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
          ls -l click.exe
          sha256sum click.exe

      - uses: actions/upload-artifact@v4
        with:
          name: click
          path: click.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Works whether the release was made on GitHub's website or by pushing a tag.
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" click.exe --clobber
